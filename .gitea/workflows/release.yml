name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  API: http://127.0.0.1:10000/api/v1
  REPO: ${{ github.repository }}
  GITEA_TOKEN: 7f7638a8da4d6782c869a786cf8e218d3db08364
  GOPROXY: https://goproxy.cn,direct
  npm_config_registry: https://registry.npmmirror.com
  GOFLAGS: -mod=mod
  GOTOOLCHAIN: local
  # Build inputs on the x86_64 runner:
  #  - a base orchestrator disk image (the installer ISO overlays this release)
  #  - the vpp-apply helper carried by the appliance package
  LY_ROUTE_ORCH_BASE_IMAGE: /root/work/orch-base/ly-route-orchestrator-base-1.0.0.img.zst
  LY_ROUTE_ORCH_BASE_ISO: /root/work/orch-base/ly-route-orchestrator-base.iso
  LY_ROUTE_ORCH_SQUASHFS_CACHE: /root/work/orch-iso/sq/squashfs-root
  LY_ROUTE_VPP_APPLY: /tmp/vpp-apply
  LY_ROUTE_MIRROR: https://mirrors.aliyun.com/debian

jobs:
  release:
    runs-on: x86-physical
    timeout-minutes: 150
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "http://127.0.0.1:10000/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: resolve version
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION="dev-$(git rev-parse --short HEAD)" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "release version: $VERSION"

      - name: go build ./...
        run: |
          set -euo pipefail
          cd backend
          go build ./...

      - name: retired controller-shell UI boundary
        run: |
          set -euo pipefail
          sh scripts/check-retired-ui-boundary.sh

      - name: orchestrator contracts
        run: |
          set -euo pipefail
          cd backend
          go test ./internal/orchestrator/... ./internal/orchestratorapi/... -count=1 -timeout 600s
          cd ..
          sh scripts/test-orchestrator-policy-contract.sh
          sh scripts/test-orchestrator-negative-contract.sh

      - name: build console bundle (frozen baseline + extras)
        run: |
          set -euo pipefail
          rm -rf /tmp/ui-orch-release
          sh scripts/build-orchestrator-ui.sh --out /tmp/ui-orch-release
          wc -c /tmp/ui-orch-release/app.js

      - name: build VPP orchestrator plugin
        run: |
          set -euo pipefail
          # The plugin carries the dataplane policy/SPAN fixes. Build it from the
          # pinned VPP development packages so the package and ISO actually ship
          # the same plugin this commit was accepted with.
          sh scripts/build-vpp-orchestrator-plugin.sh

      - name: build upgrade package (amd64)
        run: |
          set -euo pipefail
          [ -f "${LY_ROUTE_VPP_APPLY}" ] || { echo "vpp-apply build input is missing: ${LY_ROUTE_VPP_APPLY}" >&2; exit 1; }
          mkdir -p dist/release
          bash scripts/build-orchestrator-upgrade-package.sh \
            --version "${VERSION}" --out dist/release \
            --ui /tmp/ui-orch-release --vpp-apply "${LY_ROUTE_VPP_APPLY}" \
            --plugin build/vpp-orchestrator/cmake/lib/vpp_plugins/ly_route_orchestrator_plugin.so
          ls -l dist/release

      - name: build installer ISO (amd64)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          [ -f "${LY_ROUTE_ORCH_BASE_IMAGE}" ] || { echo "base disk image build input is missing: ${LY_ROUTE_ORCH_BASE_IMAGE}" >&2; exit 1; }
          [ -f "${LY_ROUTE_ORCH_BASE_ISO}" ] || { echo "base installer ISO build input is missing: ${LY_ROUTE_ORCH_BASE_ISO}" >&2; exit 1; }
          bash scripts/build-orchestrator-installer-iso-from-base.sh \
            --version "${VERSION}" \
            --image "${LY_ROUTE_ORCH_BASE_IMAGE}" \
            --package "dist/release/ly-route-orchestrator-${VERSION}-amd64.tar.zst" \
            --base-iso "${LY_ROUTE_ORCH_BASE_ISO}" \
            --squashfs-root "${LY_ROUTE_ORCH_SQUASHFS_CACHE}" \
            --out dist/release
          ls -l dist/release

      - name: checksums
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum "ly-route-orchestrator-${VERSION}-amd64.tar.zst" \
                    "ly-route-orchestrator-${VERSION}-amd64.iso" > SHA256SUMS
          cat SHA256SUMS

      - name: upload release assets
        run: |
          set -euo pipefail
          for file in \
            "dist/release/ly-route-orchestrator-${VERSION}-amd64.tar.zst" \
            "dist/release/ly-route-orchestrator-${VERSION}-amd64.iso" \
            "dist/release/SHA256SUMS"; do
            bash scripts/ci-upload-release.sh "${VERSION}" "$file"
          done
