#cloud-config
hostname: ly-lab-client
manage_etc_hosts: true
ssh_pwauth: false
users:
  - name: lab
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - __SSH_PUBKEY__
package_update: true
packages:
  - curl
  - dnsutils
  - iputils-ping
  - openssh-server
write_files:
  - path: /etc/systemd/system/lab-client-route.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Ly Route VM lab client route and DNS
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'for i in $(seq 1 180); do if ip -4 addr show eth1 2>/dev/null | grep -q "192.168.88."; then ip route replace 100.64.0.0/24 via 192.168.88.1 dev eth1; printf "nameserver 192.168.88.1\n" > /etc/resolv.conf; exit 0; fi; sleep 1; done; exit 1'
      RemainAfterExit=yes
      Restart=on-failure
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl disable --now systemd-resolved || true
  - systemctl daemon-reload
  - systemctl enable --now lab-client-route.service
  - ip link set eth1 up
