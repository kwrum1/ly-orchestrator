# ly-route-policy-routing is a static PartOf unit; nothing pulled it in on
# boot. Without it the Linux TPROXY rules and the marked proxy egress table
# disappear after reboot even though Xray and VPP are healthy. Pull it in
# whenever VPP starts; its own After=/Requires= edges order it after PPPoE and
# VPP, and its retry loop waits for the runtime underlay.
[Unit]
Wants=ly-route-policy-routing.service
