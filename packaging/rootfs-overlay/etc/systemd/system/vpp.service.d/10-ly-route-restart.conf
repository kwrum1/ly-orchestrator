# Ly Route: VPP must self-recover after a dataplane PMD crash.
#
# A destructive DPDK candidate that aborts VPP (for example vmxnet3 on ESXi
# during `set interface state up`) must not leave the appliance unreachable.
# The backend restores the kernel driver and removes the offending `dev` line;
# systemd restarts VPP so the AF_PACKET/AF_XDP fallback can come up.
[Unit]
# A bounded restart policy would leave the appliance without a dataplane after
# repeated PMD crashes. The crash guard removes the bad device, so retrying is
# safe and must not be rate-limited away.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
