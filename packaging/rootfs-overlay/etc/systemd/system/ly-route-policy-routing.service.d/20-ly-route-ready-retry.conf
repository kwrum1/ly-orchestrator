# The Linux proxy policy rules are required for TPROXY and for every marked
# Xray upstream socket. On a cold boot PPPoE may not have an address when this
# unit first runs; the apply script then deliberately defers and exits 0.
# Verify the marker it writes on a real install, and fail so Restart=on-failure
# retries until the runtime underlay exists.
[Service]
Environment=LY_ROUTE_VPP_UNDERLAY_READY_ATTEMPTS=60
Environment=LY_ROUTE_VPP_UNDERLAY_READY_INTERVAL=2
# Only a proxy generation has the proxy block; DNS-only artifacts have no
# marker and must not make this unit retry forever.
ExecStartPost=/bin/sh -c '! grep -q proxy_underlay_ready /var/lib/ly-route/policy-routing/apply.sh || test -f /run/ly-route/proxy-policy-ready'
