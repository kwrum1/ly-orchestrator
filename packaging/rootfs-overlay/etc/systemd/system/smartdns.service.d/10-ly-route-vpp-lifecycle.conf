[Unit]
PartOf=vpp.service
# Do not order SmartDNS behind the control API: DNS must be able to bind :53
# as soon as the network is up, even if the API is still starting.
Wants=ly-route-control-api.service
Wants=ly-route-dns-vpp-session.service
Before=ly-route-dns-vpp-session.service

[Service]
# ipset preparation is not a prerequisite for serving DNS. It runs in the
# sync timer's oneshot so SmartDNS never sits in start-pre at the boot check.
