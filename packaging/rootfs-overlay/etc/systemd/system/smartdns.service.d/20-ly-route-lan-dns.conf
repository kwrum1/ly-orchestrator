[Unit]
After=ly-route-vpp-apply.service
Wants=ly-route-vpp-apply.service

[Service]
TimeoutStartSec=240s
Restart=on-failure
RestartSec=5s
# Binding the LAN address before VPP has installed it makes SmartDNS exit.
# Wait for the default LAN address, then let the normal restart loop handle a
# slow apply that finishes after this bounded wait.
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 90 ]; do ip -4 -o addr show dev lylan-eth2 2>/dev/null | grep -q "192.168.88.1/24" && exit 0; i=$((i+1)); sleep 2; done; exit 1'
