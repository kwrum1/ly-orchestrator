[Unit]
# The VPP LAN tap is created by the dataplane, not by the kernel at boot.
# Wait for the apply transaction, but do not require it: Kea must still start
# (and retry) when a later reconcile creates the tap.
After=vpp.service ly-route-vpp-apply.service ly-route-vpp-session-enable.service
Wants=ly-route-vpp-apply.service
# vpp.service restart or crash recreates the tap. Stop Kea with it; the udev
# add rule starts Kea again as soon as the new lylan-* interface exists.
BindsTo=vpp.service
# Bound the retry loop. Each attempt is capped by ExecStartPre below, and the
# udev rule starts Kea immediately when a late tap appears.
StartLimitIntervalSec=600
StartLimitBurst=10

[Service]
# Waits for the exact interface named in /etc/kea/kea-dhcp4.conf, its UP flag
# and the LAN IPv4 address. It exits 1 after a bounded timeout instead of
# letting the Kea process fail with "interface ... doesn't exist".
ExecStartPre=/usr/lib/ly-route/kea-wait-lan.sh
TimeoutStartSec=120
Restart=on-failure
RestartSec=3
