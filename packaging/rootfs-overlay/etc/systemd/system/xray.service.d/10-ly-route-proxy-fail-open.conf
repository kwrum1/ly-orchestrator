# Ly Route proxy capture / steering fail-closed lifecycle.
#
# Before start: remove only our capture chain, never the DNS chains that live
# in the same table.
# After start: wait for the TPROXY listener, then re-apply the persisted
# nftables generation (so a reboot does not need a manual apply), clear the
# local failure page and remove any VPP fail-open bypass rules.
# After stop/failure: remove stale VPP bypass rules, keep VPP steering to the
# ingress TAP active, and install the fixed local failure page (or a blackhole
# if the page server is unavailable). Selected traffic must never fall through
# to the direct Internet while a proxy egress is configured.
#
# All commands are prefixed with "-": a failure must never keep Xray from
# starting.  The helper itself is best-effort and logs to the journal.
[Service]
ExecStartPre=-/usr/sbin/nft flush chain inet ly_route_proxy_capture proxy_prerouting
ExecStartPost=-/usr/lib/ly-route/proxy-failopen on
ExecStopPost=-/usr/lib/ly-route/proxy-failopen off
