# Ly Route proxy capture / steering fail-open lifecycle.
#
# Before start: remove only our capture chain, never the DNS chains that live
# in the same table.
# After start: wait for the TPROXY listener, then re-apply the persisted
# nftables generation (so a reboot does not need a manual apply) and remove
# the VPP fail-open bypass rules.
# After stop/failure: install VPP pre-NAT bypass rules first, then remove host
# capture, so selected traffic returns to the normal NAT path instead of being
# steered into a dead proxy TAP.
#
# All commands are prefixed with "-": a failure must never keep Xray from
# starting.  The helper itself is best-effort and logs to the journal.
[Service]
ExecStartPre=-/usr/sbin/nft flush chain inet ly_route_proxy_capture proxy_prerouting
ExecStartPost=-/usr/lib/ly-route/proxy-failopen on
ExecStopPost=-/usr/lib/ly-route/proxy-failopen off
