# Ly Route proxy capture fail-open guard.
#
# A TPROXY generation that points at a stopped or failed Xray listener drops
# every selected packet. Flush only our own table before start and after
# stop/failure so the chain's accept policy takes over and selected traffic
# stays on the direct path until the next verified apply installs capture.
# nft exits non-zero when the table does not exist yet, so both commands are
# intentionally prefixed with "-" (ignore failure).
[Service]
ExecStartPre=-/usr/sbin/nft flush table inet ly_route_proxy_capture
ExecStopPost=-/usr/sbin/nft flush table inet ly_route_proxy_capture
