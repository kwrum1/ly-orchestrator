<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="15">
  <meta name="robots" content="noindex, nofollow">
  <title>代理暂不可用 · Ly Route</title>
  <!-- LY-ROUTE-PROXY-FAILURE-PAGE -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fa;
      --panel: #ffffff;
      --text: #1c2333;
      --muted: #5b6478;
      --accent: #c2410c;
      --border: #e2e6ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10141c;
        --panel: #171d29;
        --text: #e6eaf2;
        --muted: #9aa4b8;
        --accent: #fb923c;
        --border: #2a3345;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      line-height: 1.6;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.16);
    }
    h1 {
      margin: 18px 0 10px;
      font-size: 26px;
      line-height: 1.3;
      font-weight: 650;
    }
    p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
    .divider { height: 1px; background: var(--border); margin: 22px 0; }
    ul { margin: 0 0 6px; padding-left: 20px; color: var(--muted); font-size: 14px; }
    li { margin: 6px 0; }
    .foot {
      margin-top: 22px;
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
    }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="badge"><span class="dot" aria-hidden="true"></span>Proxy unavailable</div>
    <h1>代理服务暂时不可用</h1>
    <p>当前选择的代理出口没有可用节点，网关已启用本地故障页面，并暂停转发代理流量。</p>
    <p>这是预期的保护行为：代理不可用时，流量不会回落到直连互联网。</p>
    <div class="divider"></div>
    <ul>
      <li>请稍候，页面每 15 秒自动重试。</li>
      <li>节点恢复后，网关会自动切回代理，无需手动操作。</li>
      <li>若长时间无法恢复，请联系管理员检查代理节点或订阅。</li>
    </ul>
    <div class="foot">
      <span>Ly Route · 本地故障页面</span>
      <span class="tag">HTTP 80 · 服务端固定页面</span>
    </div>
  </main>
</body>
</html>
