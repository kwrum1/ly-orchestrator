<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>流量镜像 · ly Orchestrator</title>
    <style>
      /* The embedded view reuses the console's page/card/table classes; only the
         mirror specific bits live here so the page matches 编排组 spacing. */
      [hidden] { display: none !important; }
      .extras-wrap { display: flex; flex-direction: column; gap: 14px; }
      .mirror-summary { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 10px; color: var(--text-tertiary); font-size: 11px; }
      .mirror-summary b { color: var(--text-secondary); font-weight: 600; }
      .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
    </style>
  </head>
  <body data-extras-page="mirror">
    <main class="extras-wrap">
      <div class="page-head">
        <div>
          <h1>流量镜像</h1>
          <p>把物理口流量复制到镜像口用于抓包。先在「网卡设置 → 角色配置」把目标端口设为镜像口，再添加镜像策略。</p>
        </div>
      </div>

      <div id="error" class="error-state" hidden></div>

      <section class="card">
        <div class="card-head">
          <div class="card-title"><h2>镜像策略</h2><p id="policy-subtitle">源接口可选多个物理口（不含管理口），输出口固定为镜像口</p></div>
        </div>
        <div class="card-body">
          <div id="no-target" class="inline-warning" hidden>
            还没有镜像口。请到「网卡设置」把目标端口的角色配置为「镜像口」，再回来添加策略。
          </div>
          <div id="mirror-summary" class="mirror-summary"></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>源接口</th>
                  <th>方向</th>
                  <th>输出口</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="policy-rows"></tbody>
            </table>
            <div id="empty" class="empty-state" hidden>
              <strong>暂无镜像策略</strong>
              <p>添加策略后，所选源接口的流量会复制到镜像口。</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/mirror.js"></script>
  </body>
</html>
