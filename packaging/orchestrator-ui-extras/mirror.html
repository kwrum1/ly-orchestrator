<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>流量镜像 · ly Orchestrator</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { padding: 0; }
      [hidden] { display: none !important; }
      .extras-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px; }
      .muted { color: var(--text-tertiary); font-size: 11px; }
      .table-wrap { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
      .policy-table { width: 100%; border-collapse: collapse; }
      .policy-table th { height: 38px; padding: 0 12px; background: var(--surface-sunken); color: var(--text-tertiary); font-size: 11px; font-weight: 600; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
      .policy-table td { height: 44px; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); vertical-align: middle; }
      .policy-table tr:last-child td { border-bottom: 0; }
      .policy-table tbody tr:hover td { background: #f8fbff; }
      .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
      .source-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
      .source-row { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius-md); }
      .source-row.checked { border-color: #c7ddf7; background: #f8fbff; }
      .source-row .name { flex: 1; min-width: 0; }
      .source-row .name strong { display: block; font-size: 12px; }
      .source-row .name small { display: block; color: var(--text-tertiary); font-size: 10px; }
    </style>
  </head>
  <body data-extras-page="mirror">
    <main class="extras-wrap">
      <div class="page-head">
        <div>
          <h1>流量镜像</h1>
          <p>把物理口流量复制到镜像口用于抓包。先在「网卡设置 → 角色配置」把目标端口设为镜像口，再添加镜像策略。</p>
        </div>
      </div>

      <div id="error" class="error-state" hidden></div>

      <section class="card">
        <div class="card-head">
          <div class="card-title"><h2>镜像策略</h2><p id="policy-subtitle">源接口可选多个物理口（不含管理口），输出口固定为镜像口</p></div>
        </div>
        <div class="card-body">
          <div id="no-target" class="inline-warning" hidden>
            还没有镜像口。请到「网卡设置」把目标端口的角色配置为「镜像口」，再回来添加策略。
          </div>
          <div class="table-wrap">
            <table class="policy-table">
              <thead><tr><th style="width:260px">源接口</th><th style="width:140px">方向</th><th style="width:220px">输出口</th><th style="width:110px">状态</th><th style="width:120px">操作</th></tr></thead>
              <tbody id="policy-rows"></tbody>
            </table>
            <div id="empty" class="muted" style="padding:18px 12px">暂无镜像策略。</div>
          </div>
        </div>
      </section>
    </main>

    <script src="/mirror.js"></script>
  </body>
</html>
