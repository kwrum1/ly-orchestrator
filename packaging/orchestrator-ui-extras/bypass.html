<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>故障旁路 · ly Orchestrator</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { padding: 0; }
      [hidden] { display: none !important; }
      .extras-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 22px; border-bottom: 1px solid var(--border); background: #fff; }
      .extras-topbar .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; }
      .extras-topbar .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #4f46e5 55%, #7c3aed); color: #fff; box-shadow: inset 0 0 0 1px #ffffff30, 0 3px 8px #2563eb47; }
      .extras-topbar .spacer { flex: 1; }
      .extras-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px; }
      .extras-topbar a.back { color: var(--text-secondary); text-decoration: none; font-size: 12px; }
      .extras-topbar a.back:hover { color: var(--accent); }
      .group-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .kv { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--text-tertiary); font-size: 11px; }
      .kv b { color: var(--text-secondary); font-weight: 600; }
      .group-card .card-body { display: flex; flex-direction: column; gap: 12px; }
      .group-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      @media (max-width: 1100px) { .group-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body data-extras-page="bypass">
    <header class="extras-topbar">
      <a class="back" href="/">← 返回控制台</a>
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M15 34V26c0-1.66 1.34-3 3-3h2.4" stroke-width="3.6"/><path d="M24 19.4L27.6 23L24 26.6L20.4 23Z" stroke-width="2.6"/><path d="M27.6 23h2.4c1.66 0 3-1.34 3-3v-4.5" stroke-width="3.6"/><circle cx="15" cy="34" r="3.6" fill="currentColor" stroke="none"/><circle cx="33" cy="15.5" r="3.2" stroke-width="2.7"/></svg></span>ly Orchestrator</div>
      <div class="spacer"></div>
      <button class="btn btn-sm" id="refresh">刷新</button>
      <button class="btn btn-sm btn-primary" id="save-config">保存探测配置</button>
    </header>

    <main class="extras-wrap">
      <div class="page-head">
        <div>
          <h1>故障旁路</h1>
          <p>按编排组独立检测：请求发出但满窗口零响应时，仅旁路该组的策略；其它组继续执行策略。</p>
        </div>
      </div>

      <div id="error" class="error-state" hidden></div>

      <section class="card">
        <div class="card-head">
          <div class="card-title"><h2>总览</h2><p>无流量 = unknown，不旁路；满窗口有请求且零成功才旁路</p></div>
          <div class="card-actions"><span id="aggregate-badge" class="badge badge-neutral">读取中</span></div>
        </div>
        <div class="card-body">
          <div class="kv" id="aggregate"></div>
          <div class="inline-warning" style="margin-top: 12px">
            数据面按组统计发往探测目标的请求与反向响应。窗口内 attempts 为 0 时保持 unknown，绝不切换路径；只有 attempts &gt; 0 且 success = 0 且窗口已满才进入 bypass。手工强制会暂停自动恢复，直到再次手工恢复。
          </div>
        </div>
      </section>

      <div class="group-grid" id="groups"></div>
    </main>

    <script src="/bypass.js"></script>
  </body>
</html>
