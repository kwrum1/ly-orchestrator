<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>编排组 · ly Orchestrator</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { padding: 0; }
      [hidden] { display: none !important; }
      .extras-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 22px; border-bottom: 1px solid var(--border); background: #fff; }
      .extras-topbar .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; }
      .extras-topbar .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #4f8df7); color: #fff; font-size: 13px; }
      .extras-topbar .spacer { flex: 1; }
      .extras-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px; }
      .extras-topbar a.back { color: var(--text-secondary); text-decoration: none; font-size: 12px; }
      .extras-topbar a.back:hover { color: var(--accent); }
      .group-row { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(160px, 1fr) minmax(160px, 1fr) auto; gap: 10px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .group-row:last-child { border-bottom: 0; }
      .group-empty { padding: 14px 0; color: var(--text-tertiary); font-size: 11px; }
      @media (max-width: 1100px) { .group-row { grid-template-columns: 1fr 1fr; } }
    </style>
  </head>
  <body data-extras-page="groups">
    <header class="extras-topbar">
      <a class="back" href="/">← 返回控制台</a>
      <div class="brand"><span class="brand-mark">LR</span>ly Orchestrator</div>
      <div class="spacer"></div>
      <button class="btn btn-sm" id="refresh">刷新</button>
      <button class="btn btn-sm btn-primary" id="save-groups">保存编排组</button>
    </header>

    <main class="extras-wrap">
      <div class="page-head">
        <div>
          <h1>编排组</h1>
          <p>每组必须且只能有一个 LAN-facing、一个 WAN-facing 端口；服务链按组顺序经过。所有编辑在页内完成。</p>
        </div>
      </div>

      <div id="error" class="error-state" hidden></div>

      <section class="card">
        <div class="card-head">
          <div class="card-title"><h2>编排组</h2><p>直接在下方表单中新增、修改或移除，保存后立即应用</p></div>
          <div class="card-actions"><button class="btn btn-sm" id="add-group">新增编排组</button></div>
        </div>
        <div class="card-body">
          <div id="groups"></div>
        </div>
      </section>

      <div class="inline-warning">
        保存编排组会 PUT /api/v1/orchestrator/topology，并同步应用透明编排与策略；端口不能与网卡设置中的管理口/LAN/WAN 重复。
      </div>
    </main>

    <script src="/groups.js"></script>
  </body>
</html>
