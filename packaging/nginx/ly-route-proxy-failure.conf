# Ly Route fixed proxy failure page.
#
# The nftables failure generation redirects TCP/80 on the proxy ingress TAP to
# this listener. nftables redirect rewrites the destination to the ingress
# interface address, so the listener is bound to all local addresses on a
# dedicated port. The page is a packaged static file with inline CSS and no
# external assets; no API or state is exposed here.
server {
    listen 8081;
    server_name _;

    root /usr/share/ly-route/proxy-failure;
    index index.html;

    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Ly-Route-Proxy-Failure "1" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "proxy-failure\n";
    }

    location / {
        try_files $uri /index.html =404;
    }
}
